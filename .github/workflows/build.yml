name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Sestavit podepsané APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build release APK
        run: ./gradlew assembleRelease printVersion --stacktrace

      - name: Resolve versioned APK
        id: version
        run: |
          APK=$(ls app/build/outputs/apk/release/LinkWrapper-*.apk)
          NAME=$(basename "$APK" .apk | sed 's/^LinkWrapper-//')
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "APK: $APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LinkWrapper-${{ steps.version.outputs.name }}
          path: ${{ steps.version.outputs.apk }}
          if-no-files-found: error

      - name: Create GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          name: Link Wrapper ${{ steps.version.outputs.name }}
          files: ${{ steps.version.outputs.apk }}
          generate_release_notes: true
          make_latest: true
