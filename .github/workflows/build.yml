name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Sestavit podepsané APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build release APKs
        run: ./gradlew assemblePinnedRelease assembleSystemtrustRelease printVersion --stacktrace

      - name: Resolve versioned APKs
        id: version
        run: |
          PINNED=$(ls app/build/outputs/apk/pinned/release/LinkWrapper-*.apk)
          SYSTEM=$(ls app/build/outputs/apk/systemtrust/release/LinkWrapper-*.apk)
          NAME=$(basename "$PINNED" .apk | sed 's/^LinkWrapper-pinned-//')
          echo "pinned=$PINNED" >> "$GITHUB_OUTPUT"
          echo "system=$SYSTEM" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "PINNED: $PINNED"
          echo "SYSTEM: $SYSTEM"

      - name: Upload APK artifacts
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: LinkWrapper-${{ steps.version.outputs.name }}
          path: |
            ${{ steps.version.outputs.pinned }}
            ${{ steps.version.outputs.system }}
          if-no-files-found: error

      - name: Create GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          name: Link Wrapper ${{ steps.version.outputs.name }}
          files: |
            ${{ steps.version.outputs.pinned }}
            ${{ steps.version.outputs.system }}
          generate_release_notes: true
          make_latest: true
