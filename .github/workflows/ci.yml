name: CI

# Kontrola, že PR jde sestavit. Číslo verze se tady nezvedá —
# ostrá verze vznikne jen merge na main (workflow Build APK).
on:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Sestavit APK (bez verze)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build PR APK
        run: >
          ./gradlew assembleRelease printVersion --stacktrace
          -PversionName=1.0.0-pr${{ github.event.number }}
          -PversionCode=1

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LinkWrapper-pr${{ github.event.number }}
          path: app/build/outputs/apk/release/LinkWrapper-*.apk
          if-no-files-found: error
